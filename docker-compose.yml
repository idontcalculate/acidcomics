services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: acid
      POSTGRES_PASSWORD: acid
      POSTGRES_DB: acidcomics
    ports:
      - "5432:5432"
    volumes:
      - acidcomics_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acid -d acidcomics"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - .env
    environment:
      # DB hostname inside compose is the service name "db"
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://acid:acid@db:5432/acidcomics}
      RUST_LOG: ${RUST_LOG:-info}
      # JWT_SECRET comes from .env (via env_file). No need to repeat it here.
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  acidcomics_pg: