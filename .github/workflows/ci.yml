name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # SQLx compile-time macros will use the committed .sqlx/ data
      SQLX_OFFLINE: "true"

      # Needed because your app expects it in config; in CI it's fine to use a placeholder.
      # This is NOT a "real secret", it's just to satisfy config at build/test time.
      JWT_SECRET: "ci_placeholder_secret_do_not_use_in_prod"

      # Keep DATABASE_URL defined in case any tests/tools read it,
      # but we don't actually connect to DB in this job.
      DATABASE_URL: "postgres://acid:acid@localhost:5432/acidcomics"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features

      - name: Tests
        run: cargo test --all

      - name: Docker build
        run: docker build -t acidcomics-api .